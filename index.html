<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نبرد تانک‌ها | آنلاین دو نفره</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <h1 class="title">🎖️ نبرد تانک‌ها</h1>

  <!-- منوی اصلی -->
  <div id="screen-menu" class="screen">
    <p class="subtitle">یک بازی دو نفره آنلاین تانک‌بازی</p>
    <button id="btn-host" class="btn btn-primary">میزبانی بازی (ساخت اتاق)</button>
    <button id="btn-join" class="btn btn-secondary">پیوستن به یک بازی</button>
  </div>

  <!-- صفحه انتظار میزبان -->
  <div id="screen-host-wait" class="screen hidden">
    <p>کد اتاق رو برای دوستت بفرست:</p>
    <div id="host-id-box" class="code-box">...</div>
    <p class="hint">منتظر اتصال بازیکن دوم...</p>
  </div>

  <!-- صفحه پیوستن -->
  <div id="screen-join" class="screen hidden">
    <p>کد اتاق دوستت رو وارد کن:</p>
    <input id="join-code-input" type="text" placeholder="کد اتاق" class="text-input">
    <button id="btn-join-confirm" class="btn btn-primary">اتصال</button>
    <p id="join-status" class="hint"></p>
  </div>

  <!-- صفحه اصلی میدون جنگ: هم برای چیدمان اولیه و هم برای نبرد استفاده میشه -->
  <div id="screen-battlefield" class="screen hidden">
    <p id="placement-instruction" class="instruction hidden"></p>
    <div id="turn-indicator" class="turn-indicator hidden">...</div>

    <div class="game-layout">
      <canvas id="board" width="500" height="500"></canvas>

      <div id="side-panel" class="side-panel hidden">
        <h3>تانک‌های من</h3>
        <ul id="my-tanks-list"></ul>
        <div id="battle-actions" class="hidden">
          <div id="battle-tank-info"></div>
          <button id="btn-action-move" class="btn btn-small">حرکت 🚚</button>
          <button id="btn-action-shoot" class="btn btn-small">شلیک 💥</button>
          <button id="btn-action-cancel" class="btn btn-small btn-cancel">لغو</button>
        </div>
        <button id="btn-end-turn" class="btn btn-secondary">پایان نوبت ⏭️</button>
      </div>
    </div>

    <button id="btn-placement-ready" class="btn btn-primary hidden">آماده‌ام ✅</button>
  </div>

  <!-- صفحه پایان بازی -->
  <div id="screen-over" class="screen hidden">
    <h2 id="over-text"></h2>
    <button id="btn-restart" class="btn btn-primary">بازی جدید</button>
  </div>
</div>

<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script src="js/tanks-config.js"></script>
<script src="js/game-logic.js"></script>
<script src="js/network.js"></script>
<script src="js/render.js"></script>
<script src="js/main.js"></script>
</body>
</html>
